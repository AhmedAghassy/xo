name: xo

description: "XO game (1 or 2 players)."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/XO.png"
  image_path_ios: "assets/images/XO.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/XO.png"
  windows:
    generate: true
    image_path: "assets/images/XO.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/XO.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/XO.png

